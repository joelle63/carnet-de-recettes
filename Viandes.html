<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viandes et accompagnements – Ma cuisine du quotidien</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #FFF8DC;
      font-family: 'Montserrat', sans-serif;
      color: #582900;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---- TITRE ---- */
    .titre-principal {
      text-align: center;
      margin-top: 40px;
    }

    .titre-principal h1 {
      font-family: 'Pinyon Script', cursive;
      font-size: 70px;
      color: #800000;
      margin: 0;
    }

    /* le saut de ligne est caché par défaut */
    .saut-mobile br {
      display: none;
    }

    /* ---- LISTE ---- */
    .recettes {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;  /* 🔽 distance légèrement réduite */
    }

    .recette {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 600;
    }

    .recette img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .recette a {
      color: #582900;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .recette a:hover {
      color: #A63A00;
      text-decoration: underline;
    }

    /* ---- PIED DE PAGE ---- */
    footer {
      margin-top: auto;
      text-align: center;
      font-weight: bold;
      color: #800000;
      font-size: 18px;
      margin-bottom: 25px;
    }

    /* ---------------- RESPONSIVE ---------------- */
    @media (max-width: 700px) {
      .titre-principal {
        margin-top: 60px;
      }

      .titre-principal h1 {
        font-size: 48px;
      }

      .recettes {
        margin-top: 30px;
        gap: 8px;
        align-items: center;
      }

      .recette {
        font-size: 20px;
        gap: 8px;
      }

      .recette img {
        width: 34px;
        height: 34px;
      }

      footer {
        font-size: 15px;
        margin-bottom: 10px;
      }
    }

    @media (max-width: 480px) {

      /* 🟢 sur téléphone : on affiche le saut de ligne */
      .saut-mobile br {
        display: inline;
      }

      .titre-principal {
        margin-top: 50px;
      }

      .titre-principal h1 {
        font-size: 38px;
      }

      .recettes {
        margin-top: 25px;
        gap: 8px;
      }

      .recette {
        font-size: 18px;
      }

      footer {
        font-size: 13px;
        margin-bottom: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="titre-principal">
    <h1>
      Viandes et <span class="saut-mobile"><br></span> accompagnements
    </h1>
  </div>

  <div class="recettes">

    <!-- 🔸 LIGNE EXISTANTE -->
    <div class="recette">
      <img src="2-Poulet.png" alt="Icône poulet">
      <a href="0-Poulet.pdf" target="_blank">Poulet au curry, patates douces et épinards</a>
    </div>

    <!-- 🔸 NOUVELLE LIGNE : SAUTÉ DE VEAU AUX PANAIS -->
    <div class="recette">
      <img src="2-Panais.png" alt="Icône panais">
      <a href="0-saute-de-veau.pdf" target="_blank">Sauté de veau aux panais, carottes pomme et miel</a>
    </div>

  </div>

  <footer>Octobre 2025 — Carnet de recettes de Mamylou</footer>
</body>
</html>
