<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table des matières</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8DC;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Pinyon Script', cursive;
      font-size: 72px;
      color: #800000;
      text-align: center;
      margin-top: 50px;
      line-height: 1.1;
      margin-bottom: 10px;     /* 🔹 rapproché du UL */
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 90%;
      max-width: 550px;
    }

    li {
      font-size: 24px;
      color: #582900;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    li img {
      width: 45px;
      flex-shrink: 0;
    }

    a {
      color: #582900;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #A63A00;
    }

    footer {
      text-align: center;
      font-weight: bold;
      color: #800000;
      font-size: 20px;
      margin-top: auto;
      padding-bottom: 60px;
    }

    /* -------------------- RESPONSIVE -------------------- */
    @media (max-width: 700px) {

      h1 {
        font-size: 48px;
        margin-top: 70px;
        margin-bottom: 15px; /* cohérent */
      }

      ul {
        width: 92%;
        max-width: 450px;
      }

      li {
        font-size: 22px;
        gap: 10px;
      }

      li img {
        width: 38px;
      }

      footer {
        font-size: 15px;
        margin-top: 80px;
        padding-bottom: 60px;
      }
    }

  @media (max-width: 480px) {

  h1 {
    font-size: 38px;
    margin-top: 60px;
    margin-bottom: 15px;
  }

  /* ⭐ Tu AJOUTES cette ligne dans ton UL EXISTANT */
  ul {
    width: 94%;
    max-width: 380px;
    margin-top: 60px;  /* ← ajoute juste ça pour descendre la liste */
  }

  li {
    font-size: 20px;
    gap: 10px;
  }

  li img {
    width: 34px;
  }

  footer {
    margin-top: 170px;
    font-size: 13px;
    padding-bottom: 70px;
  }
}
</style>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Pinyon+Script&display=swap" rel="stylesheet">
</head>

    <li><img src="2-Dessert.png" alt=""> <a href="Desserts.html">Desserts</a></li>
    <li><img src="2-Marinade.png" alt=""> <a href="Marinades.html">Marinades</a></li>
